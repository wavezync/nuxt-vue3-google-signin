name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  # npm trusted publishing: npm trades GitHub's OIDC token for a short-lived
  # publish token and adds provenance, so no npm token is stored here
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org/
          # No dependency cache in release builds, as npm recommends
          cache: ""
      - run: pnpm lint
      - run: pnpm dev:prepare
      - run: pnpm typecheck
      # Ship only what passes the same tests as CI
      - run: pnpm test
      # Trusted publishing needs npm 11.5.1+; Node 24 bundles 11.x. prepack
      # builds the module again from a clean dist.
      - run: npm publish
